AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Application Template: Provisions the Cafe application using networking resources
  imported from a separate stack. It creates a bastion host, application load
  balancer, Auto Scaling group, launch template, and RDS MariaDB database.

# This template creates:
#   Amazon EC2 instance
#   Security Group

######################
# Parameters section
######################

Parameters:

  NetworkStackName:
    Description: >-
      Name of an active CloudFormation stack that contains the networking
      resources, such as the VPC and subnet that will be used in this stack.
    Type: String
    MinLength: 1
    MaxLength: 255
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    Default: lab-network

  # Workstation IP
  WorkstationIP:
    Description: >-
      The public IP address of the workstation that will be used to connect to
      the EC2 instance. This is used to create a security group rule that allows
      SSH access from this IP address.
    Type: String
    MinLength: 7
    MaxLength: 15
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    ConstraintDescription: Must be a valid IPv4 address in the format x.x.x.x
    NoEcho: true

  # Existing AMI
  CafeAMI:
    Type: AWS::EC2::Image::Id
    Default: ami-07db131af3e9581c7

  # Existing IAM Role/Instance Profile
  CafeIAMRole:
    Type: String
    Default: arn:aws:iam::073639462324:instance-profile/cafe-app-role


  # Existing Key Pair
  CafeKeyPair:
    Type: AWS::EC2::KeyPair::KeyName
    Default: cafe-app-key

  # Auto Scaling Group Sizes
  ASGMinSize:
    Type: Number
    Default: 2
    MinValue: 2

  ASGMaxSize:
    Type: Number
    Default: 6
    MinValue: 2  

  # RDS Database Password
  #DBPassword:
    #Type: String
    #NoEcho: true

  DBSnapshotID:
    Type: String
    Default: arn:aws:rds:us-east-1:073639462324:snapshot:cafe-db-initial
  

  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

######################
# Resources section
######################

Resources:

  # Security Groups
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bastion-sg
      GroupDescription: Allow SSH from your workstation IP
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub ${WorkstationIP}/32

  ELBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: elb-sg
      GroupDescription: Allow HTTP traffic from the Internet
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: web-sg
      GroupDescription: Allow HTTP traffic from elb-sg
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ELBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: rds-sg
      GroupDescription: Allow port 3306 from web-sg
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebServerSecurityGroup

  # Bastion Host
  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref CafeKeyPair
      ImageId: !Ref AmazonLinuxAMIID
      IamInstanceProfile: !Ref CafeIAMRole
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      SubnetId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-PublicSubnetA

  # RDS Subnet Group
  CafeDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for the Cafe RDS database
      SubnetIds:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetA
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetB

  # RDS Database
  CafeDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: cafe-db
      DBSnapshotIdentifier: !Ref DBSnapshotID
      DBInstanceClass: db.t3.micro
      DBSubnetGroupName: !Ref CafeDBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false

  # Target Group for Load Balancer
  CafeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cafe-tg
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      Port: 80
      Protocol: HTTP
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /index.php

  # Load Balancer
  CafeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cafe-lb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      
      Subnets:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PublicSubnetA
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PublicSubnetB
      SecurityGroups:
        - !Ref ELBSecurityGroup

  CafeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref CafeLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CafeTargetGroup


  # Launch Template
  CafeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: cafe-lt
      LaunchTemplateData:
        ImageId: !Ref CafeAMI
        InstanceType: t3.micro
        KeyName: !Ref CafeKeyPair
        IamInstanceProfile:
          Arn: !Ref CafeIAMRole
        SecurityGroupIds:
          - !Ref WebServerSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        UserData: !Base64
          'Fn::Sub': |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd php
            service httpd start
            chkconfig httpd on
            aws s3 cp s3://seis665-public/index.php /var/www/html/

  # Auto Scaling Group
  CafeAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: cafe-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref CafeLaunchTemplate
        Version: !GetAtt CafeLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetA
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetB
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-best-effort
      TargetGroupARNs:
        - !Ref CafeTargetGroup
      DesiredCapacity: 2
      MinSize: !Ref ASGMinSize
      MaxSize: !Ref ASGMaxSize
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      
  CafeTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref CafeAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 25.0
      
      
######################
# Outputs section
######################

Outputs:
  URL:
    Description: URL of the cafe website
    Value: !Sub 'http://${CafeLoadBalancer.DNSName}/cafe'

  LoadBalancerDNSName:
    Description: DNS name of the application load balancer
    Value: !GetAtt CafeLoadBalancer.DNSName

  DatabaseEndpoint:
    Description: RDS database endpoint address
    Value: !GetAtt CafeDatabase.Endpoint.Address

  DatabasePort:
    Description: RDS database endpoint port
    Value: !GetAtt CafeDatabase.Endpoint.Port

  AutoScalingGroupName:
    Description: Auto Scaling Group name
    Value: !Ref CafeAutoScalingGroup

  LaunchTemplateId:
    Description: EC2 launch template ID
    Value: !Ref CafeLaunchTemplate

  BastionHostId:
    Description: Bastion host instance ID
    Value: !Ref BastionHost
